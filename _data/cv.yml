    Publications:
      - title: Operator learning for models of tear film breakup
        authors:
          - Qinying Chen
          - Arnab Roy
          - Tobin A. Driscoll
        publisher: "Mathematical Medicine and Biology: A Journal of the IMA"
        releaseDate: 2026-08-21
        url: https://doi.org/10.1093/imammb/dqag009
        summary: Estimating tear film thickness and osmolarity from fluorescence imaging normally requires expensive inverse solvers. We replace them with neural operators trained on simulated tear film dynamics, giving a scalable route to rapid data-driven analysis of dry eye disease. Advance access, article dqag009.

      - title: Interpolation by Different Types of Quantum Channels Using Conic Programs and Further Generalisation
        authors:
          - Arnab Roy
          - Subhajit Patra
        publisher: "Preprint, arXiv:2104.07254"
        releaseDate: 2021-04-15
        url: https://doi.org/10.48550/arXiv.2104.07254
        summary: Optimization-based methods for determining the existence and construction of quantum channels that interpolate prescribed input-output quantum states, using conic programming to characterize feasible interpolation operators.

    Projects:
      - name: Stochastic Operator Learning for Tear Film Dynamics Using Diffusion Models
        summary: Diffusion-based simulation-based inference models that learn posterior distributions over the parameters governing tear film ODE systems from observed fluorescence intensity data, implemented with BayesFlow and PyTorch.
        highlights:
          - "Repository: github.com/arn97/Tearfilm_SBI_diffusion_ODE"
        start_date: 2025-01
        end_date: present

      - name: Diffusion-Based Forecasting for Kuramoto–Sivashinsky PDE
        summary: Diffusion models that generate samples from the attractor distribution of the Kuramoto–Sivashinsky equation, with the learned representations used as latent state spaces for downstream forecasting.
        highlights:
          - "Repository: github.com/arn97/Diffusion_forecast_KS"
        start_date: 2025-01
        end_date: present

      - name: PINN-Based Surrogate Modeling for Tear Film PDE Systems
        summary: Physics-informed neural networks as surrogate solvers for tear film PDE systems, learning mappings from model parameters directly to spatiotemporal solution fields.
        highlights:
          - "Repository: github.com/arn97/Tear_Film_PDE_Forward_surrogate"
        start_date: 2025-01
        end_date: present

      - name: Operator Learning for Models of Tear Film Breakup
        summary: Neural operator models learning mappings from fluorescence intensity to tear film thickness and osmolarity, using fully-connected, Fourier, and PCA-based architectures as surrogates for differential equation systems. Published in Mathematical Medicine and Biology (2026).
        highlights:
          - "Repository: github.com/tobydriscoll/sciml-tearfilms"
        start_date: 2023-01
        end_date: 2025-12

      - name: Interpolation by Quantum Channels Using Conic Programming
        summary: Undergraduate thesis at IISER Berhampur developing optimization-based methods for constructing quantum channels that interpolate prescribed input-output states.
        start_date: 2020-01
        end_date: 2021-05

